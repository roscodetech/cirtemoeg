[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfect-font"
version = "0.1.0"
description = "A parametric, mathematically-exact geometric font generator (strict purity base, optical-correction seam)."
requires-python = ">=3.10"
dependencies = [
    "fontmake>=3.10",
    "ufoLib2>=0.16",
    "fonttools>=4.50",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
perfect-font = "perfect_font.cli:main"

[tool.setuptools.packages.find]
include = ["perfect_font*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["compile: slow tests that run fontmake"]

[tool.ruff]
line-length = 100
target-version = "py310"
